[package]
name = "sapphire-ledger-cli"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "finance"]
keywords = ["accounting", "ledger", "double-entry", "cli", "mcp"]

[[bin]]
name = "sapphire-ledger"
path = "src/main.rs"

[dependencies]
sapphire-ledger-core = { path = "../sapphire-ledger-core", version = "0.1.0", default-features = false }
sapphire-ledger-mcp  = { path = "../sapphire-ledger-mcp",  version = "0.1.0", default-features = false }
clap.workspace = true
anyhow.workspace = true

[features]
default = ["redb-store"]
redb-store = ["sapphire-ledger-core/redb-store", "sapphire-ledger-mcp/redb-store"]

[dev-dependencies]
tempfile.workspace = true
