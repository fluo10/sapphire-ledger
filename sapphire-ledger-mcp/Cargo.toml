[package]
name = "sapphire-ledger-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP server logic for sapphire-ledger, reused by CLI (stdio) and Desktop (HTTP)"
license.workspace = true
repository.workspace = true
categories = ["finance"]
keywords = ["accounting", "ledger", "mcp", "double-entry"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-ledger-core/redb-store"]

[dependencies]
sapphire-ledger-core = { path = "../sapphire-ledger-core", version = "0.1.0", default-features = false }
rmcp.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
